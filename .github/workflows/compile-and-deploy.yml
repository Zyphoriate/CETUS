name: Compile LaTeX & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            texlive-publishers

      - name: Compile LaTeX
        run: |
          rm -f icce_berlin_2026.pdf icce_berlin_2026.aux icce_berlin_2026.bbl icce_berlin_2026.blg icce_berlin_2026.out
          pdflatex -interaction=nonstopmode icce_berlin_2026.tex
          bibtex icce_berlin_2026
          pdflatex -interaction=nonstopmode icce_berlin_2026.tex
          pdflatex -interaction=nonstopmode icce_berlin_2026.tex
          test -f icce_berlin_2026.pdf || { echo "ERROR: PDF not generated"; exit 1; }
          grep -c '\\bibitem' icce_berlin_2026.bbl && echo "BibTeX OK" || { echo "ERROR: no \\bibitem in bbl"; cat icce_berlin_2026.bbl; exit 1; }

      - name: Copy output to deploy dir
        run: |
          mkdir -p deploy
          cp icce_berlin_2026.pdf deploy/
          cp index.html deploy/

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Clean old Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'github-pages',
              per_page: 100,
            });

            for (const deployment of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
              });

              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
              });
            }
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
