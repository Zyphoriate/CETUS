name: Compile LaTeX & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            texlive-publishers

      - name: Compile LaTeX
        run: |
          rm -f icce_berlin_2026.pdf icce_berlin_2026.aux icce_berlin_2026.bbl icce_berlin_2026.blg icce_berlin_2026.out
          pdflatex -interaction=nonstopmode icce_berlin_2026.tex
          bibtex icce_berlin_2026
          pdflatex -interaction=nonstopmode icce_berlin_2026.tex
          pdflatex -interaction=nonstopmode icce_berlin_2026.tex
          test -f icce_berlin_2026.pdf || { echo "ERROR: PDF not generated"; exit 1; }
          grep -c '\\\\bibitem' icce_berlin_2026.bbl && echo "BibTeX OK" || { echo "ERROR: no \\bibitem in bbl"; cat icce_berlin_2026.bbl; exit 1; }

      - name: Copy output to deploy dir
        run: |
          mkdir -p deploy
          cp icce_berlin_2026.pdf deploy/
          cp index.html deploy/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
